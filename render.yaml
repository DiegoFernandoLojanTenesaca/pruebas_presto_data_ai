services:
  # ─────────────────────────────────────────────
  # Backend — FastAPI + LangChain + LangGraph
  # ─────────────────────────────────────────────
  - type: web
    name: presto-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false                # se setea en dashboard de Render
      - key: DATABASE_URL
        sync: false                # connection string de Neon/Supabase (opcional)
      - key: PYTHON_VERSION
        value: "3.11"

  # ─────────────────────────────────────────────
  # Frontend — Next.js 16
  # ─────────────────────────────────────────────
  - type: web
    name: presto-web
    runtime: node
    plan: free
    rootDir: web
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false                # URL del backend (ej: https://presto-api.onrender.com)
      - key: NODE_VERSION
        value: "22"
